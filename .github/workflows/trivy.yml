name: Trivy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Toda segunda às 06:00 (BRT) para pegar CVEs novas em dependências já mergeadas
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão do binário do Trivy. Evite 0.69.4–0.69.6 (comprometidas, CVE-2026-33634).
  TRIVY_VERSION: v0.76.0

jobs:
  repository:
    name: Repositório (deps, secrets, IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Actions fixadas por SHA: as tags do trivy-action foram sequestradas em mar/2026
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml

  image:
    name: Imagem Docker do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build da imagem
        run: docker build -t tech-challenge-backend:${{ github.sha }} ./backend

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: tech-challenge-backend:${{ github.sha }}
          trivy-config: trivy.yaml
          # Misconfig do Dockerfile já é coberta no job "repository"
          scanners: vuln,secret
