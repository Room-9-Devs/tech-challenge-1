sonar.projectKey=tech-challenge-1-backend
sonar.projectName=Tech Challenge 1 - Backend
sonar.host.url=http://localhost:9000
# O token vem da variável de ambiente SONAR_TOKEN (não versionar)

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Código gerado ou de infraestrutura de banco não entra na análise
sonar.exclusions=src/infrastructure/database/typeorm/migrations/**

# Cobertura gerada pelo Jest (npm run test:cov:unit)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/infrastructure/database/typeorm/data-source.ts,src/infrastructure/database/seeds/**,src/infrastructure/database/scripts/**,src/**/backfill-*.ts
