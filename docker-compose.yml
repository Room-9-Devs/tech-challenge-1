services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      # Datas gravadas pelo Node (new Date()) e logs no horário de Brasília
      TZ: America/Sao_Paulo
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: FixedPollingInterval
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    environment:
      TZ: America/Sao_Paulo
    # timezone: now() e DEFAULT now() no horário de Brasília
    command: >-
      sh -c 'export POSTGRES_USER="$${DATABASE_USER}" POSTGRES_PASSWORD="$${DATABASE_PASSWORD}" POSTGRES_DB="$${DATABASE_NAME}"; exec docker-entrypoint.sh postgres -c timezone=America/Sao_Paulo'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$DATABASE_USER\" -d \"$$DATABASE_NAME\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - app-network

  # Análise estática: sobe só com `docker compose --profile sonar up -d`
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: tech-challenge-sonarqube
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Evita exigir vm.max_map_count alto do Elasticsearch embutido no Docker Desktop
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - app-network

  sonar-db:
    image: postgres:18-alpine
    container_name: tech-challenge-sonar-db
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonar -d sonar" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:

networks:
  app-network:
    driver: bridge
